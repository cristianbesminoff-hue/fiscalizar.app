<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fiscalização</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0b5cad">
<style>
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:#f2f4f7;color:#1a1d21}
header{background:#0b5cad;color:#fff;padding:18px 14px}header b{font-size:21px}header div{color:#d6e6f7;font-size:13px;margin-top:3px}
main{padding:14px;display:none}.m{color:#556;font-size:13px;margin:2px 0}
.bt{display:block;width:100%;text-align:left;border:0;border-radius:14px;padding:18px;margin-bottom:12px;background:#fff;box-shadow:0 1px 3px #0003;font:inherit;color:#1a1d21;border-left:8px solid #0b5cad}
.bt b{display:block;font-size:19px;margin-bottom:3px}.bt span{color:#556;font-size:14px}.bt.o{border-left-color:#e67e22}.bt.g{border-left-color:#1a8a4a}
input{font:inherit;padding:9px;border:1px solid #ccd;border-radius:8px;width:100%}
button{font:inherit;border:0;border-radius:8px;padding:10px;background:#0b5cad;color:#fff}button.s{background:#e3e8ef;color:#1a1d21}button.g{background:#1a8a4a}
.a{display:flex;gap:6px;margin-top:8px}.a button{flex:1}
#gate{position:fixed;inset:0;background:#0b5cad;z-index:3000;display:flex;align-items:center;justify-content:center;padding:20px}.gb{background:#fff;border-radius:14px;padding:18px;width:100%;max-width:360px}
</style></head><body>
<header><b>Fiscalização</b><div id="who"></div><div style="font-size:11px;opacity:.7">versão 6</div></header>
<main id="menu">
 <button class="bt" onclick="location.href='vistoria.html'"><b>🔎 Vistoria</b><span>Protocolos, mapa, rota e execução</span></button>
 <button class="bt o" onclick="location.href='faltantes.html'"><b>📦 Solicitação</b><span>EPIs e ferramentas faltantes, entrega e prazo</span></button>
 <button class="bt g" onclick="location.href='kits.html'"><b>📋 Kits por setor</b><span>Listas de EPIs e ferramentas em PDF</span></button>
 <div class="a"><button id="bio" class="s" onclick="bioToggle()" style="display:none">👆 Ativar digital</button><button id="out" class="s" onclick="CL&&CL.Au.signOut(CL.auth)">Sair da conta</button></div>
</main>
<div id="gate"><div class="gb" id="gc">Carregando...</div></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const FBV='10.14.1',FBC={apiKey:"AIzaSyDVK9Xo4URV_hbG133RMhjyiAiCkqLBT4k",authDomain:"vistoria-ftta.firebaseapp.com",databaseURL:"https://vistoria-ftta-default-rtdb.firebaseio.com",projectId:"vistoria-ftta",storageBucket:"vistoria-ftta.firebasestorage.app",messagingSenderId:"470874503323",appId:"1:470874503323:web:4739909f2deca9c311ee3e"};
let CL=null,entered=false,unlocked=false,fresh=false;
const EM={'auth/invalid-credential':'E-mail ou senha incorretos.','auth/invalid-login-credentials':'E-mail ou senha incorretos.','auth/wrong-password':'E-mail ou senha incorretos.','auth/user-not-found':'E-mail ou senha incorretos.','auth/too-many-requests':'Muitas tentativas. Espere um pouco.','auth/network-request-failed':'Sem internet.','auth/user-disabled':'Conta desativada.'};
const GATE=h=>{$('#gc').innerHTML=h;$('#gate').style.display='flex'};
const bioKey=u=>'bio_'+u,bioOK=()=>!!(window.PublicKeyCredential&&navigator.credentials&&location.protocol==='https:');
const b64=x=>btoa(String.fromCharCode(...new Uint8Array(x))),unb64=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
function openApp(email){
 entered=true;$('#gate').style.display='none';$('#menu').style.display='block';
 $('#who').textContent=email||'Modo local (sem login)';$('#out').style.display=CL&&CL.user?'block':'none';updBio();
}
function updBio(){const b=$('#bio'),u=CL&&CL.user;b.style.display=u&&bioOK()?'block':'none';if(u)b.textContent=localStorage.getItem(bioKey(u.uid))?'👆 Desativar digital':'👆 Ativar digital'}
async function bioEnable(u){
 try{
  const c=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'Fiscalização'},user:{id:new TextEncoder().encode(u.uid).slice(0,64),name:u.email,displayName:u.email},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},timeout:60000}});
  localStorage.setItem(bioKey(u.uid),b64(c.rawId));return true;
 }catch(e){return false}
}
async function bioCheck(uid){try{await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:unb64(localStorage.getItem(bioKey(uid)))}],userVerification:'required',timeout:60000}});return true}catch(e){return false}}
async function bioGo(){if(!(await bioEnable(CL.user)))alert('Não consegui ativar a digital neste aparelho.');skipBio()}
function skipBio(){unlocked=true;try{sessionStorage.setItem('unl','1')}catch(e){}openApp(CL.user.email)}
function bioToggle(){
 const u=CL.user;
 if(localStorage.getItem(bioKey(u.uid))){localStorage.removeItem(bioKey(u.uid));updBio();alert('Digital desativada.')}
 else bioEnable(u).then(ok=>{updBio();alert(ok?'Digital ativada.':'Não consegui ativar a digital neste aparelho.')});
}
async function bioUnlock(){const u=CL&&CL.user;if(!u)return;if(await bioCheck(u.uid))skipBio();else{const e=$('#lerr');if(e)e.textContent='Digital não reconhecida. Tente de novo.'}}
function showLock(u){GATE(`<b>Fiscalização</b><div class="m">${esc(u.email)}</div><div class="a" style="margin-top:12px"><button class="g" onclick="bioUnlock()">👆 Desbloquear com a digital</button></div><div id="lerr" class="m" style="color:#c0392b;margin-top:8px"></div><div class="m" style="text-align:center;margin-top:10px"><a href="#" onclick="CL.Au.signOut(CL.auth);return false">usar outra conta</a></div>`)}
function loginUI(){GATE(`<b>Fiscalização</b><div class="m">Entre com seu e-mail e senha.</div><input id="le" type="email" autocomplete="username" placeholder="E-mail" style="margin:10px 0 8px"><input id="lp" type="password" autocomplete="current-password" placeholder="Senha"><div id="lerr" class="m" style="color:#c0392b;margin-top:6px"></div><div class="a" style="margin-top:10px"><button onclick="doLogin()">Entrar</button></div>`)}
async function doLogin(){
 const e=$('#le').value.trim(),p=$('#lp').value,er=$('#lerr');
 if(!e||!p){er.textContent='Preencha e-mail e senha.';return}
 er.textContent='Entrando...';fresh=true;
 try{await CL.Au.signInWithEmailAndPassword(CL.auth,e,p)}catch(x){fresh=false;er.textContent=EM[x.code]||('Erro: '+(x.code||x.message))}
}
function enter(u){
 try{localStorage.setItem('fp_last',JSON.stringify({uid:u.uid,email:u.email}))}catch(e){}
 if(fresh&&bioOK()&&!localStorage.getItem(bioKey(u.uid))){
  fresh=false;
  GATE(`<b>Ativar a digital?</b><div class="m">Nas próximas vezes você abre o app só com a digital. Vale só para este aparelho.</div><div class="a" style="margin-top:12px"><button class="s" onclick="skipBio()">Agora não</button><button class="g" onclick="bioGo()">Ativar</button></div>`);
  return;
 }
 fresh=false;skipBio();
}
function authChanged(u){
 CL.user=u;
 if(!u){unlocked=false;entered=false;try{sessionStorage.removeItem('unl')}catch(e){}$('#menu').style.display='none';loginUI();return}
 if(entered){updBio();return}
 let unl=false;try{unl=sessionStorage.getItem('unl')==='1'}catch(e){}
 if(bioOK()&&localStorage.getItem(bioKey(u.uid))&&!unlocked&&!unl&&!fresh){showLock(u);return}
 enter(u);
}
function offlineGate(){
 if(entered)return;let l=null;try{l=JSON.parse(localStorage.getItem('fp_last'))}catch(e){}
 if(!l){GATE('<b>Sem conexão</b><div class="m">No primeiro acesso é preciso internet para entrar.</div><div class="a" style="margin-top:10px"><button onclick="location.reload()">Tentar de novo</button></div>');return}
 GATE(`<b>Sem internet</b><div class="m">Entrar offline como ${esc(l.email)}.</div><div class="a" style="margin-top:10px"><button onclick="offEnter()">${localStorage.getItem(bioKey(l.uid))?'👆 Desbloquear com a digital':'Continuar offline'}</button></div>`);
}
async function offEnter(){
 const l=JSON.parse(localStorage.getItem('fp_last'));
 if(localStorage.getItem(bioKey(l.uid))&&!(await bioCheck(l.uid))){alert('Digital não reconhecida.');return}
 try{sessionStorage.setItem('unl','1')}catch(e){}openApp(l.email);
}
async function cloudInit(){
 if(CL)return;
 if(!/^https?:$/.test(location.protocol)){if(!entered)openApp(null);return}
 try{
  const B='https://www.gstatic.com/firebasejs/'+FBV+'/';
  const to=new Promise((_,rj)=>setTimeout(()=>rj(new Error('timeout')),8000));
  const [A,Au]=await Promise.race([Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js')]),to]);
  const app=A.initializeApp(FBC);CL={Au,auth:Au.getAuth(app),user:null};
  Au.onAuthStateChanged(CL.auth,authChanged);
 }catch(e){CL=null;offlineGate()}
}
addEventListener('online',()=>{if(!CL)cloudInit()});
cloudInit();
</script></body></html>
